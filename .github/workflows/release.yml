# Tag flow: bump package.json, commit, `git tag v$(bun -p "require('./package.json').version")`
# then push the tag. This workflow tests, builds standalone `bun build --compile`
# binaries (no runtime needed), and attaches them to the GitHub release.
# Manual runs (workflow_dispatch) stop after test + build as a dry run.
# Needs a GitHub repo remote; provenance/SLSA out of scope.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: beamline-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            out: beamline-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            out: beamline-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun build --compile --target=${{ matrix.target }} --outfile ${{ matrix.out }} src/cli.ts
      - run: ./${{ matrix.out }} --version
      # Compressed asset: bun binaries gzip ~2.4x (60MB→25MB), so install.sh
      # downloads .gz first and falls back to the raw asset for old tags.
      - run: gzip -9 -k "${{ matrix.out }}"
      - name: init smoke-test in a fresh workspace
        shell: bash
        run: |
          mkdir -p /tmp/blsmoke/bin /tmp/blsmoke/ws
          cp "${{ matrix.out }}" "/tmp/blsmoke/bin/beamline${{ endsWith(matrix.out, '.exe') && '.exe' || '' }}"
          cd /tmp/blsmoke/ws && PATH="/tmp/blsmoke/bin:$PATH" beamline init
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: |
            ${{ matrix.out }}
            ${{ matrix.out }}.gz
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: tag matches package.json
        run: test "${GITHUB_REF#refs/tags/}" = "v$(bun -p "require('./package.json').version")"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: github release with binaries
        run: gh release create "${GITHUB_REF#refs/tags/}" dist/* --title "${GITHUB_REF#refs/tags/}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
