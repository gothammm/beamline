# Tag flow: bump package.json, commit, `git tag v$(bun -p "require('./package.json').version")`
# then push the tag. This workflow tests, publishes to npm (needs an
# NPM_TOKEN repo secret, skipped without one), and attaches standalone
# `bun build --compile` binaries (no runtime needed) to the GitHub release.
# Needs a GitHub repo remote; provenance/SLSA out of scope.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: beamline-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            out: beamline-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            out: beamline-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun build --compile --target=${{ matrix.target }} --outfile ${{ matrix.out }} src/cli.ts
      - run: ./${{ matrix.out }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: tag matches package.json
        run: test "${GITHUB_REF#refs/tags/}" = "v$(bun -p "require('./package.json').version")"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: github release with binaries
        run: gh release create "${GITHUB_REF#refs/tags/}" dist/* --title "${GITHUB_REF#refs/tags/}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm publish
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
